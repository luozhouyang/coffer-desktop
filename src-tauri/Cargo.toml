[package]
name = "coffer"
version = "0.2.0"
description = "Local-first encrypted secrets manager for developers"
authors = ["luozhouyang"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coffer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.3"
zeroize = "1.9.1"
secrecy = "0.10.3"
hex = "0.4.3"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
arboard = "3.7.0"
specta = { version = "2.0.0-rc.26", default-features = false }
tauri-specta = { version = "2.0.0-rc.26", default-features = false, features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
tempfile = "3.27.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", features = ["block2"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
